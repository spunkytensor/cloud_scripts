[package]
name = "vps"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "vps"
path = "src/main.rs"

[lib]
name = "vps_control_plane"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
