#cloud-config
package_update: true
package_upgrade: false

users:
  - default
  - name: agent
    gecos: Codex worker
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __AGENT_SSH_AUTHORIZED_KEY__

packages:
  - bash
  - build-essential
  - ca-certificates
  - curl
  - docker.io
  - git
  - gh
  - jq
  - rsync

write_files:
  - path: /etc/ssh/sshd_config.d/60-codex-worker.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no
      AllowUsers agent
  - path: /usr/local/bin/gh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      token_file=""
      if [[ -n "${HOME:-}" ]]; then
        token_file="${HOME}/.config/vps-codex/github-token"
      fi
      if [[ -n "${token_file}" && -s "${token_file}" ]]; then
        export GH_TOKEN="$(cat "${token_file}")"
      fi

      if [[ "${1:-}" == auth && "${2:-}" == setup-git ]]; then
        [[ -s "${token_file}" ]] || {
          echo "GitHub credential is missing: ${token_file:-HOME is unset}" >&2
          exit 1
        }
        hostname="github.com"
        shift 2
        while (( $# > 0 )); do
          case "$1" in
            -h|--hostname)
              (( $# >= 2 )) || { echo "$1 requires a hostname" >&2; exit 2; }
              hostname="$2"
              shift 2
              ;;
            -f|--force)
              shift
              ;;
            *)
              echo "unsupported gh auth setup-git argument: $1" >&2
              exit 2
              ;;
          esac
        done
        [[ "${hostname}" == github.com ]] || {
          echo "this worker only supports gh auth setup-git for github.com" >&2
          exit 2
        }
        git config --global --unset-all 'credential.https://github.com.helper' >/dev/null 2>&1 || true
        git config --global --add 'credential.https://github.com.helper' ''
        git config --global --add 'credential.https://github.com.helper' '!/usr/local/bin/gh auth git-credential'
        exit 0
      fi

      exec /usr/bin/gh "$@"
  - path: /etc/sysctl.d/60-codex-worker.conf
    permissions: "0644"
    content: |
      fs.inotify.max_user_watches=524288
      fs.inotify.max_user_instances=1024
  - path: /usr/local/sbin/bootstrap-codex-worker
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      systemctl restart ssh
      systemctl enable --now docker
      usermod -aG docker agent

      node_setup="$(mktemp)"
      codex_setup="$(mktemp)"
      trap 'rm -f "${node_setup}" "${codex_setup}"' EXIT

      curl -fSLo "${node_setup}" https://deb.nodesource.com/setup_22.x
      bash "${node_setup}"
      apt-get install -y nodejs
      corepack enable || true

      curl -fSLo "${codex_setup}" https://chatgpt.com/codex/install.sh
      chown agent:agent "${codex_setup}"
      runuser -u agent -- env HOME=/home/agent sh "${codex_setup}"
      ln -sfn /home/agent/.local/bin/codex /usr/local/bin/codex

      install -d -o agent -g agent -m 0755 \
        /home/agent/projects \
        /home/agent/.codex \
        /home/agent/.config/vps-codex

      command -v docker >/dev/null
      runuser -u agent -- docker info >/dev/null
      command -v node >/dev/null
      test -x /usr/bin/gh
      test -x /usr/local/bin/gh
      test -x /usr/local/bin/codex
      codex_version="$(codex --version | awk '{print $2}')"
      dpkg --compare-versions "${codex_version}" ge 0.143.0
      touch /opt/codex-worker-ready

runcmd:
  - /usr/local/sbin/bootstrap-codex-worker
