version = 1
default_backend = "digitalocean"

# Optional. When omitted, vps uses the platform state directory. During the
# Bash migration it discovers a repository-local .state/instances directory.
# state_dir = "/absolute/path/to/vps-state/instances"

[ssh]
private_key = "~/.ssh/id_digitalocean_v2"

[git]
author_name = "Codex VPS Agent"
author_email = "codex-vps-agent@users.noreply.github.com"

[backends.digitalocean]
ssh_key = "replace-with-key-id-or-fingerprint"
region = "nyc3"
size = "s-4vcpu-8gb"
image = "ubuntu-24-04-x64"
tags = ["codex-agent"]
name_prefix = "codex-agent"

# Set DIGITALOCEAN_TOKEN in the environment. Never put cloud or GitHub tokens
# in this file.
