name: Release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version for a non-publishing dry run
        required: true

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.96.1
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy && rustup default "$RUST_TOOLCHAIN"
      - id: version
        shell: bash
        env:
          DRY_VERSION: ${{ inputs.version }}
        run: |
          package=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vps") | .version')
          case "$GITHUB_EVENT_NAME" in
            push) requested=${GITHUB_REF_NAME#v} ;;
            workflow_dispatch) requested=$DRY_VERSION ;;
            *) requested=$package ;;
          esac
          [[ "$requested" == "$package" && "$package" != *-* ]] || { echo 'tag/input must equal a non-prerelease Cargo package version' >&2; exit 1; }
          [[ "$(cargo run --locked -- --version)" == *"$package"* ]] || { echo 'CLI version mismatch' >&2; exit 1; }
          echo "version=$package" >>"$GITHUB_OUTPUT"
      - name: Verify signed release tag with GitHub
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/git"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ref=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/ref/tags/$GITHUB_REF_NAME")
          [[ "$(jq -r '.object.type' <<<"$ref")" == tag ]] || { echo 'release tag must be an annotated signed tag' >&2; exit 1; }
          tag=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/tags/$(jq -r '.object.sha' <<<"$ref")")
          jq -e '.verification.verified == true and .verification.reason == "valid"' <<<"$tag" >/dev/null || {
            echo 'GitHub did not verify the release tag signature as valid' >&2
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - run: source packaging/tools.env && cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
      - run: cargo deny --all-features check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            kind: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            kind: deb
            deb_arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install exact toolchain and target
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}' && rustup default "$RUST_TOOLCHAIN"
      - name: Build locked release
        run: cargo build --workspace --all-features --locked --release --target ${{ matrix.target }}
      - name: Generate third-party notice
        shell: bash
        run: |
          source packaging/tools.env
          cargo install cargo-about --version "=${CARGO_ABOUT_VERSION}" --locked
          cargo about generate --config packaging/about.toml packaging/about.hbs > target/THIRD_PARTY_LICENSES.txt
      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary='target/${{ matrix.target }}/release/vps'
          dest=target/stage
          test -x "$binary"
          test -f README.md
          rm -rf "$dest"
          mkdir -p "$dest/bin" "$dest/completions"
          install -m 0755 "$binary" "$dest/bin/vps"
          install -m 0644 README.md target/THIRD_PARTY_LICENSES.txt "$dest/"
          test ! -f LICENSE || install -m 0644 LICENSE "$dest/"
          "$binary" completion bash >"$dest/completions/vps.bash"
          "$binary" completion zsh >"$dest/completions/_vps"
          "$binary" completion fish >"$dest/completions/vps.fish"
          find "$dest" -type f -exec touch -d '@0' {} + 2>/dev/null || true
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/stage-windows.ps1 -Target '${{ matrix.target }}' -Destination 'target/stage'
      - name: Build Debian package
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          stage=target/stage
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
            "$root/usr/share/bash-completion/completions" \
            "$root/usr/share/zsh/vendor-completions" \
            "$root/usr/share/fish/vendor_completions.d" \
            "$root/usr/share/doc/vps"
          install -m 0755 "$stage/bin/vps" "$root/usr/bin/vps"
          install -m 0644 "$stage/completions/vps.bash" "$root/usr/share/bash-completion/completions/vps"
          install -m 0644 "$stage/completions/_vps" "$root/usr/share/zsh/vendor-completions/_vps"
          install -m 0644 "$stage/completions/vps.fish" "$root/usr/share/fish/vendor_completions.d/vps.fish"
          install -m 0644 "$stage/README.md" "$root/usr/share/doc/vps/README.md"
          install -m 0644 "$stage/THIRD_PARTY_LICENSES.txt" "$root/usr/share/doc/vps/"
          test ! -f "$stage/LICENSE" || install -m 0644 "$stage/LICENSE" "$root/usr/share/doc/vps/"
          cat >"$root/DEBIAN/control" <<'EOF'
          Package: vps
          Version: ${{ needs.verify.outputs.version }}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: cloud_scripts maintainers
          Section: admin
          Priority: optional
          Description: Safe control plane for disposable cloud workers
          EOF
          find "$root" -print0 | xargs -0 touch -d '@0'
          dpkg-deb --root-owner-group --build "$root" "target/vps_${{ needs.verify.outputs.version }}_${{ matrix.deb_arch }}.deb"
      - name: Smoke test native binary and Debian package
        if: matrix.kind == 'deb'
        shell: bash
        run: |
          target/stage/bin/vps --version
          sudo dpkg -i target/vps_*.deb
          vps --version
          sudo dpkg -r vps
      - name: Archive staged tree
        shell: bash
        run: |
          cd target
          if [[ '${{ matrix.kind }}' == tar && "$RUNNER_OS" == macOS ]]; then COPYFILE_DISABLE=1 tar -czf "vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz" stage; fi
          if [[ '${{ matrix.kind }}' == tar && "$RUNNER_OS" != macOS ]]; then tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf "vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz" stage; fi
          if [[ '${{ matrix.kind }}' == zip ]]; then 7z a "vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.zip" ./stage/*; fi
      - name: Generate CycloneDX SBOM from locked release dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: target
          list-all-pkgs: true
          format: cyclonedx
          output: target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.cdx.json
          version: v0.72.0
      - name: Gate locked release dependencies
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: target
          format: table
          output: target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.trivy.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.72.0
      - name: Gate generated SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.cdx.json
          format: table
          output: target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.sbom-trivy.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.72.0
      - name: Validate generated security evidence is populated
        if: always()
        shell: bash
        run: |
          sbom='target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.cdx.json'
          report='target/vps-${{ needs.verify.outputs.version }}-${{ matrix.target }}.trivy.txt'
          jq -e '[.components[]? | select(.purl | strings | startswith("pkg:cargo/"))] | length > 0' "$sbom" >/dev/null
          grep -q 'Cargo.lock' "$report"
      - name: Upload SBOM and Trivy reports directly
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.target }}
          path: |
            target/*.cdx.json
            target/*trivy.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            target/*.tar.gz
            target/*.zip
            target/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Attest all release subjects
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/* --verify-tag --generate-notes --title '${{ github.ref_name }}'
