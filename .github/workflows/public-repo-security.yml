name: Spunky Tensor security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '49 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    uses: spunkytensor/.github/.github/workflows/trivy.yml@69b5f260fb4358acb0e2f7b2a96254ad9cc2322c

  inventory:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - run: bash packaging/scan-lockfile.sh "$RUNNER_TEMP/lock-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-lockfile
          path: ${{ runner.temp }}/lock-evidence/
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@5dd1a818453bcefdd972f23546c3cee641dc0e34
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  cargo-deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Install pinned cargo-deny
        run: source packaging/tools.env && cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
      - run: cargo deny --all-features check

  trivy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository configuration and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          scan-ref: .
          format: table
          output: trivy-config-secret.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Repository vulnerability gate
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: .
          format: table
          output: trivy-vulnerability.txt
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Produce downloadable SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Upload Trivy reports directly
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports
          path: |
            trivy-*.txt
            trivy.sarif
          if-no-files-found: error
          retention-days: 14
