name: Security
on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml', '.github/workflows/**', 'packaging/**']
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Install pinned cargo-deny
        run: source packaging/tools.env && cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
      - run: cargo deny --all-features check

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Repository configuration and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          scan-ref: .
          format: table
          output: trivy-config-secret.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Repository vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: .
          format: table
          output: trivy-vulnerability.txt
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Produce SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Upload SARIF in trusted context
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # Code scanning may be disabled; scan gates above remain blocking.
        uses: github/codeql-action/upload-sarif@3c3833e0f8c1c83d449a7478aa59c036a9165498 # v3.28.17
        with:
          sarif_file: trivy.sarif
      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: |
            trivy-*.txt
            trivy.sarif
          retention-days: 14
