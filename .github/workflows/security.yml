name: Security
on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml', '.github/workflows/**', 'packaging/**']
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Install pinned cargo-deny
        run: source packaging/tools.env && cargo install cargo-deny --version "=${CARGO_DENY_VERSION}" --locked
      - run: cargo deny --all-features check

  trivy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository configuration and secret gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          scan-ref: .
          format: table
          output: trivy-config-secret.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Repository vulnerability gate
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: .
          format: table
          output: trivy-vulnerability.txt
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Produce downloadable SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
          version: v0.72.0
      - name: Upload Trivy reports directly
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports
          path: |
            trivy-*.txt
            trivy.sarif
          if-no-files-found: error
          retention-days: 14
